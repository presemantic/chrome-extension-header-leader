<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Header Leader by www.presemantic.com</title>
    <link rel="stylesheet" href="manager.css">
  </head>
  <body>
    <header class="popup-header">
      <div class="brand" aria-label="Header Leader by www.presemantic.com">
        <img class="brand-mark" src="icons/icon-32.png" alt="">
        <span class="brand-name">Header Leader</span>
        <a class="brand-detail" href="https://www.presemantic.com/" target="_blank" rel="noreferrer">by www.presemantic.com</a>
      </div>

      <div class="header-actions">
        <span id="saveStatus" class="save-status" role="status">Ready</span>
        <label class="master-switch">
          <input id="extensionEnabled" type="checkbox">
          <span class="switch-track" aria-hidden="true"><span></span></span>
          <span id="enabledLabel">Enabled</span>
        </label>
      </div>
    </header>

    <main class="manager-layout" aria-label="Header profile editor">
      <aside class="profiles-panel">
        <div class="panel-heading">
          <div>
            <h1>Profiles</h1>
          </div>
          <div class="profile-heading-actions">
            <button id="undoDeleteProfile" class="undo-action" type="button" disabled>UNDO</button>
            <button id="addProfile" class="icon-action" type="button" aria-label="Add profile" title="Add profile">+</button>
          </div>
        </div>

        <div class="profile-list-shell">
          <nav id="profileList" class="profile-list" aria-label="Header profiles"></nav>
          <div id="profileScrollbar" class="profile-scrollbar" aria-hidden="true">
            <div id="profileScrollbarThumb" class="profile-scrollbar-thumb"></div>
          </div>
        </div>
      </aside>

      <section class="headers-panel">
        <div class="panel-heading headers-heading">
          <div>
            <h1>Headers</h1>
          </div>
          <div class="header-heading-actions">
            <button id="undoDeleteHeader" class="undo-action" type="button" disabled>UNDO</button>
            <button id="addHeader" class="icon-action" type="button" aria-label="Add header" title="Add header">+</button>
          </div>
        </div>

        <div class="headers-table" role="table" aria-label="Headers in selected profile">
          <div class="headers-table-head" role="row">
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span role="columnheader">Name</span>
            <span role="columnheader">Value</span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </div>
          <div id="headerRows" class="header-rows"></div>
          <div id="emptyHeaders" class="empty-state" hidden>
            <p>No headers in this profile.</p>
          </div>
          <div id="headerScrollbar" class="header-scrollbar" aria-hidden="true">
            <div id="headerScrollbarThumb" class="header-scrollbar-thumb"></div>
          </div>
        </div>
      </section>
    </main>

    <template id="profileItemTemplate">
      <div class="profile-item">
        <button class="edit-profile-name" type="button" aria-label="Edit profile name" title="Edit profile name">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m4 16-.8 4.8L8 20l10.5-10.5-4-4L4 16Zm8.8-8.8 4 4M14.5 5.5l1.4-1.4a2 2 0 0 1 2.8 0l1.2 1.2a2 2 0 0 1 0 2.8l-1.4 1.4"/>
          </svg>
        </button>
        <div class="profile-name-cell">
          <button class="profile-name-display" type="button"></button>
          <input class="profile-name-input" type="text" maxlength="32" autocomplete="off" spellcheck="false" aria-label="Profile name" hidden>
        </div>
        <label class="profile-switch" title="Activate or deactivate profile">
          <input class="profile-active" type="checkbox">
          <span aria-hidden="true"></span>
          <span class="visually-hidden">Activate profile</span>
        </label>
        <button class="delete-profile-icon" type="button" aria-label="Delete profile" title="Delete profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/>
          </svg>
        </button>
      </div>
    </template>

    <template id="headerRowTemplate">
      <div class="header-row" role="row">
        <button class="drag-handle" type="button" draggable="true" aria-label="Drag to reorder header" title="Drag to reorder">
          <svg viewBox="0 0 16 24" aria-hidden="true">
            <circle cx="5" cy="6" r="1.5"/><circle cx="11" cy="6" r="1.5"/>
            <circle cx="5" cy="12" r="1.5"/><circle cx="11" cy="12" r="1.5"/>
            <circle cx="5" cy="18" r="1.5"/><circle cx="11" cy="18" r="1.5"/>
          </svg>
        </button>
        <label class="row-switch" title="Enable or disable this header">
          <input class="header-enabled" type="checkbox">
          <span aria-hidden="true"></span>
          <span class="visually-hidden">Enable header</span>
        </label>
        <label class="header-name-field">
          <span class="visually-hidden">Header name</span>
          <input class="header-name" type="text" placeholder="X-Header-Name" autocomplete="off" spellcheck="false">
          <small class="field-error"></small>
        </label>
        <label>
          <span class="visually-hidden">Header value</span>
          <input class="header-value" type="text" placeholder="Value" autocomplete="off" spellcheck="false">
        </label>
        <label>
          <span class="visually-hidden">Header mode</span>
          <select class="header-operation">
            <option value="set">Set</option>
            <option value="append">Append</option>
            <option value="remove">Remove</option>
          </select>
        </label>
        <button class="delete-header-icon" type="button" aria-label="Delete header" title="Delete header">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/>
          </svg>
        </button>
      </div>
    </template>

    <script src="core.js"></script>
    <script src="manager.js"></script>
  </body>
</html>
